<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>Quantum Inu #4 — Comics</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif; color:#e8f4ff;
    background: radial-gradient(1100px 750px at 50% -12%, #12224d 0%, #0a1030 46%, #030208 100%);
    min-height:100vh; padding:64px 12px 40px; text-align:center;
  }
  .backpill { position:fixed; top:12px; left:12px; z-index:50; display:inline-block;
    background:rgba(11,23,58,.92); color:#e8f4ff; border:1px solid rgba(255,255,255,.25);
    border-radius:999px; padding:9px 16px; font-weight:700; font-size:14px; text-decoration:none;
    box-shadow:0 6px 20px rgba(0,0,0,.5); }
  .backpill:active { transform:scale(.96); }
  .wrap { max-width:680px; margin:0 auto; }
  h1 { font-size:clamp(24px,6vw,38px); letter-spacing:1.5px; font-weight:900; color:#7fdcff;
       text-shadow:0 0 14px rgba(41,182,255,.85), 0 0 42px rgba(41,182,255,.45); }
  .sub { opacity:.85; margin:6px 0 20px; font-size:15px; }
  .stage { position:relative; }
  .page { display:block; width:100%; height:auto; border-radius:10px; margin:0 auto;
          box-shadow:0 10px 34px rgba(0,0,0,.6); cursor:zoom-in; }
  .expandhint { margin-top:8px; font-size:12.5px; opacity:.65; }
  .flipbar { margin-top:16px; display:flex; gap:12px; justify-content:center; align-items:center; }
  .flipbtn { font:inherit; font-weight:800; color:#03101f; background:linear-gradient(180deg,#8fe3ff,#29b6ff);
    border:none; border-radius:999px; padding:12px 24px; cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.4); }
  .flipbtn:active { transform:scale(.96); }
  .flipbtn:disabled { opacity:.35; cursor:default; box-shadow:none; }
  .dots { display:flex; gap:8px; justify-content:center; margin-top:14px; }
  .dots i { width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,.22); cursor:pointer; }
  .dots i.on { background:#7fdcff; box-shadow:0 0 10px rgba(41,182,255,.8); }
  .endnav { margin-top:28px; display:flex; gap:12px; justify-content:center; align-items:center; flex-wrap:wrap; width:100%; }
  .endnav a { display:inline-flex; align-items:center; justify-content:center; text-align:center; line-height:1.1; background:linear-gradient(180deg,#8fe3ff,#29b6ff); color:#03101f;
    font-weight:800; border-radius:999px; padding:12px 22px; text-decoration:none;
    box-shadow:0 4px 12px rgba(0,0,0,.4); }
  .endnav a.ghost { background:rgba(255,255,255,.08); color:#e8f4ff; border:1px solid rgba(255,255,255,.25); box-shadow:none; }
  .lightbox { position:fixed; inset:0; z-index:90; background:rgba(2,4,12,.96); display:none;
    align-items:center; justify-content:center; padding:10px; }
  .lightbox.open { display:flex; }
  .lightbox img { width:auto; height:auto; max-width:96vw; max-height:94vh; max-height:94dvh; object-fit:contain; border-radius:6px; cursor:zoom-out; }
  .lbclose { position:fixed; top:12px; right:12px; z-index:91; width:46px; height:46px; border-radius:50%;
    border:1px solid rgba(255,255,255,.35); background:rgba(11,23,58,.92); color:#e8f4ff;
    font-size:22px; line-height:1; cursor:pointer; }
  .lbnav { position:fixed; top:50%; transform:translateY(-50%); z-index:91; width:46px; height:64px;
    border:1px solid rgba(255,255,255,.25); background:rgba(11,23,58,.85); color:#e8f4ff;
    font-size:26px; cursor:pointer; border-radius:12px; }
  .lbnav.prev { left:10px; } .lbnav.next { right:10px; }
  .lbnav:disabled { opacity:.3; cursor:default; }
  @media (min-width:700px) {
    .page { width:auto; max-width:100%; max-height:calc(100vh - 300px); max-height:calc(100dvh - 300px); }
  }
</style>
</head>
<body>
<a class="backpill" href="../index.html#comics">← Comics</a>
<div class="wrap">
  <h1>QUANTUM INU #1</h1>
  <p class="sub">No signal. No rescue call. A hunt through the Shadow Realm.</p>
  <div class="stage">
    <img class="page" id="pageImg" src="../assets/comics/issue-4/cover.jpg" alt="Quantum Inu #4 cover">
  </div>
  <p class="expandhint">Tap the page to expand it full screen ⤢</p>
  <div class="flipbar">
    <button class="flipbtn" id="prevBtn" type="button">← Prev</button>
    <button class="flipbtn" id="nextBtn" type="button">Next →</button>
  </div>
  <div class="dots" id="dots"></div>
  <div class="endnav">
    <a class="ghost" href="quantum-inu-3.html">← Read Issue #3</a>
    <a class="ghost" href="../index.html#comics">📚 All Comics</a>
  </div>
</div>
<div class="lightbox" id="lightbox">
  <button class="lbclose" id="lbClose" type="button" aria-label="Close">✕</button>
  <button class="lbnav prev" id="lbPrev" type="button" aria-label="Previous page">‹</button>
  <img id="lbImg" src="" alt="Quantum Inu #4 expanded page">
  <button class="lbnav next" id="lbNext" type="button" aria-label="Next page">›</button>
</div>
<script>
(function(){
  var PAGES = ['cover','page-1','page-2','page-3','page-4'].map(function(n){
    return '../assets/comics/issue-4/' + n + '.jpg';
  });
  var i = 0;
  var img = document.getElementById('pageImg'),
      prev = document.getElementById('prevBtn'),
      next = document.getElementById('nextBtn'),
      dots = document.getElementById('dots'),
      lb = document.getElementById('lightbox'),
      lbImg = document.getElementById('lbImg'),
      lbPrev = document.getElementById('lbPrev'),
      lbNext = document.getElementById('lbNext');
  PAGES.forEach(function(src, k){
    var im = new Image(); im.src = src;
    var d = document.createElement('i');
    d.addEventListener('click', function(){ go(k); });
    dots.appendChild(d);
  });
  function render(){
    img.src = PAGES[i];
    lbImg.src = PAGES[i];
    prev.disabled = (i === 0);
    next.disabled = (i === PAGES.length - 1);
    lbPrev.disabled = prev.disabled;
    lbNext.disabled = next.disabled;
    [].forEach.call(dots.children, function(d, k){ d.className = (k === i) ? 'on' : ''; });
  }
  function go(n){
    i = Math.max(0, Math.min(PAGES.length - 1, n));
    render();
  }
  prev.addEventListener('click', function(){ go(i - 1); });
  next.addEventListener('click', function(){ go(i + 1); });
  lbPrev.addEventListener('click', function(e){ e.stopPropagation(); go(i - 1); });
  lbNext.addEventListener('click', function(e){ e.stopPropagation(); go(i + 1); });
  img.addEventListener('click', function(){ lb.classList.add('open'); render(); });
  document.getElementById('lbClose').addEventListener('click', function(){ lb.classList.remove('open'); });
  lb.addEventListener('click', function(e){ if (e.target !== lbImg) lb.classList.remove('open'); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') lb.classList.remove('open');
    if (e.key === 'ArrowLeft') go(i - 1);
    if (e.key === 'ArrowRight') go(i + 1);
  });
  var tx = null;
  document.addEventListener('touchstart', function(e){ tx = e.changedTouches[0].clientX; }, {passive:true});
  document.addEventListener('touchend', function(e){
    if (tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 48) go(i + (dx < 0 ? 1 : -1));
    tx = null;
  }, {passive:true});
  render();
})();
</script>
</body>
</html>
