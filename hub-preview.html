<style>

html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,sans-serif}

  if (m > 1) { vx /= m; vy /= m; }
  me.moving = m > 0.12;
  if (me.moving) {
    const sp = 305;
    const res = collide(me.x + vx * sp * dt, me.y + vy * sp * dt);
    me.x = res.x; me.y = res.y;
    if (vx > 0.2) me.flip = true; else if (vx < -0.2) me.flip = false;
    if (now - stepAt > 270) { stepAt = now; sfxStep(); }
    if (res.door) toArcade();
    if (res.exit) toPlaza();
    if (res.theatre) toTheatre();
    if (res.back) toArcadeFromTheatre();
  }
  publish(false);
  const dims = sceneDims(), roomW = dims.w, roomH = dims.h;
  SCALE = Math.max(0.36, Math.min(VW / 1280, VH / 980, 1.0));
  camX = Math.max(0, Math.min(roomW - VW / SCALE, me.x - VW / (2 * SCALE)));
  camY = Math.max(0, Math.min(roomH - VH / SCALE, me.y - VH / (2 * SCALE)));
  if (roomW * SCALE < VW) camX = (roomW - VW / SCALE) / 2;
  if (roomH * SCALE < VH) camY = (roomH - VH / SCALE) / 2;
  drawStars(camX, camY, SCALE);
  ctx.save();
  if (me.scene === "plaza") drawPlaza(now); else if (me.scene === "arcade") drawArcade(now); else drawTheatre(now);
  if (me.scene === "theatre") { if (vid.dataset.cur && vid.paused) vid.play().catch(() => {}); }
  else if (!vid.paused) vid.pause();
  ctx.restore();
  const actors = [];
  for (const p of peers.values()) {
    if (p.scene !== me.scene) continue;
    p.x += (p.tx - p.x) * Math.min(1, dt * 9); p.y += (p.ty - p.y) * Math.min(1, dt * 9);
    actors.push(p);
  }
  actors.push(me);
  actors.sort((a, b) => a.y - b.y);
  ctx.save(); ctx.scale(SCALE, SCALE); ctx.translate(-camX, -camY);
  for (const a of actors) {
    const isMe = a === me;
    const moving = isMe ? me.moving : (Math.abs(a.tx - a.x) + Math.abs(a.ty - a.y) > 7);
    const phase = isMe ? 0 : a.bob * 7;
    const chatAge = a.chatId ? Date.now() - a.chatId : 999999;
    drawPlayer(a.x, a.y, a.hero, a.name, a.flip, phase, a.chat, chatAge, isMe, now, moving);
  }
  ctx.restore();
  const cab = nearestCabinet();
  if (cab) { promptBtn.style.display = "block"; promptBtn.textContent = "▶ PLAY " + cab.title; promptAction = () => playCabinet(cab); }
  else if (nearPedestal()) { promptBtn.style.display = "block"; promptBtn.textContent = "📺 Change Channel"; promptAction = changeChannel; }
  else { promptBtn.style.display = "none"; promptAction = null; }
}
requestAnimationFrame(frame);
if (profile) { gate.scrollTop = 0; }
</script>
