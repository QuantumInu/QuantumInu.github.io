<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Quantum Radio</title>
    <style>
      :root {
        --bg: #050914;
        --bg2: #0b1e3a;
        --panel: rgba(16, 32, 62, 0.72);
        --panel-solid: #0d1c36;
        --panel-hover: rgba(34, 211, 238, 0.08);
        --row-active: rgba(34, 211, 238, 0.13);
        --line: rgba(125, 180, 255, 0.14);
        --text: #eaf4ff;
        --muted: #9db4d4;
        --faint: #6d86ab;
        --cyan: #22d3ee;
        --cyan-deep: #0ea5c6;
        --gold: #f5c451;
        --radius: 14px;
        --player-h: 116px;
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
      body {
        margin: 0;
        overscroll-behavior: none;
        touch-action: manipulation;
        font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
        color: var(--text);
        background:
          radial-gradient(1100px 500px at 85% -10%, rgba(56, 130, 246, 0.22), transparent 60%),
          radial-gradient(900px 480px at -10% 20%, rgba(34, 211, 238, 0.10), transparent 55%),
          radial-gradient(700px 500px at 60% 110%, rgba(124, 58, 237, 0.12), transparent 60%),
          linear-gradient(180deg, var(--bg2) 0%, var(--bg) 340px);
        background-color: var(--bg);
        min-height: 100vh;
        padding-bottom: calc(var(--player-h) + env(safe-area-inset-bottom) + 18px);
      }
      /* starfield */
      .stars, .stars::before, .stars::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }
      .stars {
        background-image:
          radial-gradient(1.5px 1.5px at 12% 22%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 34% 68%, #cfe9ff 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 57% 12%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 78% 44%, #ffe9a8 50%, transparent 51%),
          radial-gradient(1px 1px at 91% 80%, #fff 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 45% 88%, #bfe9ff 50%, transparent 51%),
          radial-gradient(1px 1px at 6% 55%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 66% 33%, #fff 50%, transparent 51%);
        opacity: 0.55;
      }
      .stars::before {
        background-image:
          radial-gradient(1px 1px at 22% 40%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 48% 5%, #d8f4ff 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 70% 72%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 84% 18%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 3% 90%, #cfe9ff 50%, transparent 51%),
          radial-gradient(1px 1px at 95% 55%, #ffe9a8 50%, transparent 51%);
        opacity: 0.4;
      }
      .stars::after {
        background-image:
          radial-gradient(1px 1px at 18% 75%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 40% 28%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 62% 58%, #d8f4ff 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 88% 92%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 52% 95%, #fff 50%, transparent 51%);
        opacity: 0.3;
      }
      .wrap {
        position: relative;
        z-index: 1;
        max-width: 1060px;
        margin: 0 auto;
        padding: 26px 18px 10px;
      }
      /* ---------- header ---------- */
      header.hero { display: flex; gap: 18px; align-items: center; margin-bottom: 18px; }
      .radio-badge {
        flex: 0 0 auto;
        width: 76px; height: 76px;
        display: grid; place-items: center;
        font-size: 38px;
        border-radius: 20px;
        background: linear-gradient(145deg, rgba(34,211,238,.25), rgba(14,60,120,.55));
        border: 1px solid rgba(34,211,238,.45);
        box-shadow: 0 0 26px rgba(34,211,238,.28), inset 0 0 18px rgba(34,211,238,.15);
      }
      .hero h1 {
        margin: 0;
        font-size: clamp(28px, 5.4vw, 44px);
        font-weight: 800;
        letter-spacing: -0.5px;
        line-height: 1.05;
      }
      .hero h1 .accent { color: var(--cyan); }
      .hero p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
      .hero p strong { color: var(--gold); font-weight: 700; }
      /* ---------- toolbar ---------- */
      .toolbar {
        display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
        margin-bottom: 12px;
      }
      .searchbox {
        flex: 1 1 240px;
        display: flex; align-items: center; gap: 9px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0 16px;
        backdrop-filter: blur(8px);
      }
      .searchbox svg { flex: 0 0 auto; opacity: .75; }
      .searchbox input {
        flex: 1; min-width: 0;
        background: none; border: 0; outline: 0;
        color: var(--text);
        font: inherit; font-size: 16px;
        padding: 12px 0;
      }
      .searchbox input::placeholder { color: var(--faint); }
      .btn {
        appearance: none; border: 0; cursor: pointer;
        font: inherit; font-weight: 700; font-size: 15px;
        border-radius: 999px;
        padding: 12px 22px;
        display: inline-flex; align-items: center; gap: 8px;
        transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
      }
      .btn:active { transform: scale(.97); }
      .btn-play {
        background: linear-gradient(135deg, #38e0f8, var(--cyan-deep));
        color: #03222e;
        box-shadow: 0 4px 22px rgba(34,211,238,.35);
      }
      .btn:focus-visible, .chip:focus-visible, .hcell:focus-visible, .row:focus-visible, .pbtn:focus-visible, .genre-toggle:focus-visible, .np-close:focus-visible {
        outline: 2px solid var(--cyan); outline-offset: 2px;
      }
      /* ---------- genre menu (collapsible) ---------- */
      .genre-menu { margin: 4px 0 16px; }
      .genre-toggle {
        appearance: none; cursor: pointer;
        font: inherit; font-size: 14.5px; font-weight: 600;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 9px 16px;
        display: inline-flex; align-items: center; gap: 9px;
        backdrop-filter: blur(8px);
      }
      .genre-toggle .g-label {
        color: var(--faint); font-weight: 700; font-size: 12px;
        letter-spacing: .06em; text-transform: uppercase;
      }
      .genre-toggle .g-current { color: var(--cyan); }
      .genre-toggle svg { transition: transform .4s cubic-bezier(.32,.72,.24,1); }
      .genre-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
      .genre-panel {
        display: grid; grid-template-rows: 0fr;
        opacity: 0; visibility: hidden;
        transition: grid-template-rows .45s cubic-bezier(.32,.72,.24,1), opacity .35s ease, visibility 0s linear .45s;
      }
      .genre-panel.open {
        grid-template-rows: 1fr;
        opacity: 1; visibility: visible;
        transition: grid-template-rows .45s cubic-bezier(.32,.72,.24,1), opacity .35s ease, visibility 0s;
      }
      .genre-panel-in { overflow: hidden; min-height: 0; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 12px; }
      .chip {
        appearance: none; cursor: pointer;
        font: inherit; font-size: 13.5px; font-weight: 600;
        color: var(--muted);
        background: rgba(13, 28, 54, .8);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 7px 14px;
      }
      .chip[aria-pressed="true"] {
        color: #03222e;
        background: var(--cyan);
        border-color: var(--cyan);
      }
      /* ---------- track table ---------- */
      .table {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        backdrop-filter: blur(10px);
        overflow: hidden;
      }
      .thead, .row {
        display: grid;
        grid-template-columns: 44px 52px minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, .9fr) 58px;
        align-items: center;
        gap: 12px;
        padding: 0 16px;
      }
      .thead {
        border-bottom: 1px solid var(--line);
        color: var(--faint);
        font-size: 12.5px;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
        user-select: none;
      }
      .hcell {
        appearance: none; background: none; border: 0; cursor: pointer;
        color: inherit; font: inherit; text-align: left;
        padding: 13px 0;
        display: inline-flex; align-items: center; gap: 5px;
      }
      .hcell.num { cursor: default; justify-content: center; }
      .hcell.dur { justify-content: flex-end; text-align: right; }
      .hcell .arrow { color: var(--cyan); font-size: 10px; width: 10px; }
      .hcell.sorted { color: var(--cyan); }
      .row {
        min-height: 64px;
        padding-top: 6px; padding-bottom: 6px;
        cursor: pointer;
        border-bottom: 1px solid rgba(125,180,255,.06);
      }
      .row:last-child { border-bottom: 0; }
      .row:hover { background: var(--panel-hover); }
      .row.active { background: var(--row-active); }
      .row.active .r-title { color: var(--cyan); }
      .r-num {
        text-align: center; color: var(--faint); font-size: 14px;
        font-variant-numeric: tabular-nums;
        display: grid; place-items: center; height: 28px;
      }
      .row .play-hint { display: none; color: var(--cyan); font-size: 13px; }
      .row:hover .r-num .idx, .row:focus-visible .r-num .idx { display: none; }
      .row:hover .play-hint, .row:focus-visible .play-hint { display: block; }
      .row.active .r-num .idx { display: none; }
      .row.active .play-hint,
      .row.active:hover .play-hint, .row.active:focus-visible .play-hint { display: none; }
      .eq { display: none; align-items: flex-end; gap: 2.5px; height: 16px; }
      .row.active .eq { display: inline-flex; }
      .eq i {
        width: 3.5px; border-radius: 2px;
        background: var(--cyan);
        height: 30%;
        animation: eqbounce 0.9s ease-in-out infinite;
      }
      .eq i:nth-child(2) { animation-delay: .22s; }
      .eq i:nth-child(3) { animation-delay: .45s; }
      .eq i:nth-child(4) { animation-delay: .12s; }
      body:not(.playing) .eq i { animation-play-state: paused; height: 30%; }
      @keyframes eqbounce {
        0%, 100% { height: 25%; }
        50% { height: 100%; }
      }
      @media (prefers-reduced-motion: reduce) {
        .eq i { animation: none; height: 60%; }
        .btn { transition: none; }
        .genre-panel, .np-expand, .genre-toggle svg, .now, .player { transition: none; }
      }
      .r-art {
        width: 52px; height: 52px;
        border-radius: 9px;
        object-fit: cover;
        background: #12294d;
        display: block;
      }
      .r-main { min-width: 0; }
      .r-title {
        font-weight: 650; font-size: 15.5px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .r-sub {
        display: none;
        color: var(--muted); font-size: 13px; margin-top: 2px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .r-artist, .r-genre {
        color: var(--muted); font-size: 14.5px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .r-dur {
        color: var(--muted); font-size: 14px; text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .empty {
        padding: 44px 20px; text-align: center; color: var(--muted);
        display: none;
      }
      .empty.show { display: block; }
      .foot {
        margin: 18px 4px 0;
        color: var(--faint); font-size: 13px; text-align: center;
      }
      .foot a { color: var(--cyan); text-decoration: none; }
      /* ---------- player bar ---------- */
      .player {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
        background: rgba(7, 15, 32, 0.92);
        border-top: 1px solid rgba(34,211,238,.25);
        backdrop-filter: blur(14px);
        padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
        box-shadow: 0 -10px 34px rgba(0,0,0,.5);
      }
      .player { transition: background .4s ease; }
      .player.expanded { background: rgba(4, 9, 22, 0.97); }
      .player-in {
        max-width: 1060px; margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas: "expand expand" "now controls" "seek seek";
        gap: 6px 14px; align-items: center;
      }
      .now {
        grid-area: now; display: flex; align-items: center; gap: 12px; min-width: 0;
        max-height: 64px; overflow: hidden;
        transition: max-height .45s cubic-bezier(.32,.72,.24,1), opacity .3s ease;
      }
      .player.expanded .now { max-height: 0; opacity: 0; }
      .now img {
        width: 54px; height: 54px; border-radius: 10px; object-fit: cover;
        background: #12294d; flex: 0 0 auto;
        border: 1px solid rgba(34,211,238,.3);
        cursor: pointer;
      }
      /* ---------- expanded now playing ---------- */
      .np-expand {
        grid-area: expand;
        display: grid; grid-template-rows: 0fr;
        opacity: 0; visibility: hidden;
        transition: grid-template-rows .55s cubic-bezier(.32,.72,.24,1), opacity .4s ease, visibility 0s linear .55s;
      }
      .player.expanded .np-expand {
        grid-template-rows: 1fr;
        opacity: 1; visibility: visible;
        transition: grid-template-rows .55s cubic-bezier(.32,.72,.24,1), opacity .4s ease, visibility 0s;
      }
      .np-expand-in {
        overflow: hidden; min-height: 0;
        display: flex; flex-direction: column; align-items: center;
        text-align: center;
      }
      .np-close {
        appearance: none; background: none; border: 0; cursor: pointer;
        color: var(--muted);
        width: 42px; height: 34px;
        display: grid; place-items: center;
        border-radius: 999px;
        margin-top: 2px;
      }
      .np-close:hover { color: var(--text); }
      .np-big-art {
        width: min(62vw, 290px, 40vh);
        aspect-ratio: 1 / 1;
        border-radius: 16px; object-fit: cover;
        background: #12294d;
        border: 1px solid rgba(34,211,238,.35);
        box-shadow: 0 18px 50px rgba(0,0,0,.6), 0 0 34px rgba(34,211,238,.18);
        cursor: pointer;
        margin-top: 6px;
      }
      .np-big-title { font-size: 22px; font-weight: 800; margin-top: 16px; line-height: 1.2; }
      .np-big-artist { color: var(--muted); font-size: 15px; margin: 5px 0 10px; }
      .now .n-title { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .now .n-artist { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .now .n-none { color: var(--faint); font-size: 14px; }
      .controls { grid-area: controls; display: flex; align-items: center; gap: 6px; }
      .pbtn {
        appearance: none; background: none; border: 0; cursor: pointer;
        color: var(--muted);
        width: 42px; height: 42px;
        display: grid; place-items: center;
        border-radius: 50%;
        position: relative;
      }
      .pbtn:hover { color: var(--text); }
      .pbtn.on { color: var(--cyan); }
      .pbtn.on::after {
        content: ""; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
        width: 4px; height: 4px; border-radius: 50%; background: var(--cyan);
      }
      .pbtn .rep-one {
        position: absolute; top: 4px; right: 2px;
        font-size: 9px; font-weight: 800; color: var(--cyan);
        display: none;
      }
      .pbtn.repeat-one .rep-one { display: block; }
      .pbtn-main {
        width: 52px; height: 52px;
        background: linear-gradient(135deg, #38e0f8, var(--cyan-deep));
        color: #03222e;
        box-shadow: 0 4px 18px rgba(34,211,238,.4);
      }
      .pbtn-main:hover { color: #03222e; }
      .seekrow {
        grid-area: seek;
        display: flex; align-items: center; gap: 10px;
        font-size: 12.5px; color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      input[type="range"] {
        -webkit-appearance: none; appearance: none;
        flex: 1; min-width: 0;
        height: 5px; border-radius: 99px;
        background: linear-gradient(to right, var(--cyan) var(--fill, 0%), rgba(125,180,255,.25) var(--fill, 0%));
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 15px; height: 15px; border-radius: 50%;
        background: #fff; border: 0;
        box-shadow: 0 1px 6px rgba(0,0,0,.55);
      }
      input[type="range"]::-moz-range-thumb {
        width: 15px; height: 15px; border-radius: 50%;
        background: #fff; border: 0;
        box-shadow: 0 1px 6px rgba(0,0,0,.55);
      }

      /* ---------- responsive ---------- */
      @media (min-width: 721px) {
        :root { --player-h: 104px; }
        .player-in {
          grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
          grid-template-areas: "expand expand expand" "now controls ." "seek seek seek";
        }
      }
      @media (max-width: 720px) {
        .thead, .row { grid-template-columns: 30px 48px minmax(0, 1fr) 50px; gap: 10px; padding: 0 12px; }
        .hcell.artist, .hcell.genre, .r-artist, .r-genre { display: none; }
        .r-art { width: 48px; height: 48px; }
        .r-title { white-space: normal; overflow: visible; text-overflow: clip; line-height: 1.25; }
        .r-sub { display: block; }
        .radio-badge { width: 60px; height: 60px; font-size: 30px; border-radius: 16px; }
        .btn { padding: 11px 18px; }
      }
    </style>
  </head>
  <body>
    <div class="stars" aria-hidden="true"></div>
    <div class="wrap">
      <header class="hero">
        <div class="radio-badge" aria-hidden="true">⚛️</div>
        <div>
          <h1>Quantum <span class="accent">Radio</span></h1>
          <p>Every song from the quantum realm, in one station — <strong id="trackCount">34 songs</strong></p>
        </div>
      </header>

      <div class="toolbar">
        <label class="searchbox">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9db4d4" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg>
          <input id="search" type="search" placeholder="Search songs, artists, genres…" aria-label="Search songs, artists and genres" autocomplete="off" />
        </label>
      </div>

      <div class="genre-menu">
        <button class="genre-toggle" id="genreToggle" type="button" aria-expanded="false" aria-controls="genrePanel">
          <span class="g-label">Genre</span>
          <span class="g-current" id="genreCurrent">All genres</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="genre-panel" id="genrePanel">
          <div class="genre-panel-in">
            <div class="chips" id="chips" role="group" aria-label="Filter by genre"></div>
          </div>
        </div>
      </div>

      <div class="table" role="table" aria-label="Quantum Radio track list">
        <div class="thead" role="row">
          <span class="hcell num" aria-hidden="true">#</span>
          <span></span>
          <button class="hcell" type="button" data-sort="title">Title <span class="arrow"></span></button>
          <button class="hcell artist" type="button" data-sort="artist">Artist <span class="arrow"></span></button>
          <button class="hcell genre" type="button" data-sort="genre">Genre <span class="arrow"></span></button>
          <button class="hcell dur" type="button" data-sort="dur">Time <span class="arrow"></span></button>
        </div>
        <div id="rows"></div>
        <div class="empty" id="emptyState">No songs match that search. Try another title, artist, or genre.</div>
      </div>

      <p class="foot">All tracks stream from <a href="https://quantuminuofficial.com" target="_blank" rel="noopener">quantuminuofficial.com</a> — the home of Quantum Inu.</p>
    </div>

    <div class="player" role="region" aria-label="Now playing">
      <div class="player-in">
        <div class="np-expand" id="npExpand" aria-hidden="true">
          <div class="np-expand-in">
            <button class="np-close" id="npClose" type="button" aria-label="Collapse now playing" tabindex="-1">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <img class="np-big-art" id="npBigArt" alt="" />
            <div class="np-big-title" id="npBigTitle"></div>
            <div class="np-big-artist" id="npBigArtist"></div>
          </div>
        </div>
        <div class="now">
          <img id="npArt" alt="" hidden role="button" tabindex="0" aria-expanded="false" aria-label="Expand now playing" title="Expand now playing" />
          <div style="min-width:0">
            <div class="n-title" id="npTitle"><span class="n-none">Pick a song to start the station</span></div>
            <div class="n-artist" id="npArtist"></div>
          </div>
        </div>
        <div class="controls">
          <button class="pbtn" id="shuffleBtn" type="button" aria-label="Toggle shuffle" aria-pressed="false" title="Shuffle">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
          </button>
          <button class="pbtn" id="prevBtn" type="button" aria-label="Previous track">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h2.4v14H7zM19 5.8v12.4c0 .9-1 1.5-1.8 1L8.6 13a1.15 1.15 0 0 1 0-2L17.2 4.9c.8-.5 1.8 0 1.8.9z"/></svg>
          </button>
          <button class="pbtn pbtn-main" id="playBtn" type="button" aria-label="Play">
            <svg id="playIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13c0 .8.9 1.3 1.6.9l10-6.5c.6-.4.6-1.4 0-1.8l-10-6.5C8.9 4.2 8 4.7 8 5.5z"/></svg>
            <svg id="pauseIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z"/></svg>
          </button>
          <button class="pbtn" id="nextBtn" type="button" aria-label="Next track">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><path d="M14.6 5H17v14h-2.4zM5 5.8v12.4c0 .9 1 1.5 1.8 1l8.6-6.2a1.15 1.15 0 0 0 0-2L6.8 4.9C6 4.4 5 4.9 5 5.8z"/></svg>
          </button>
          <button class="pbtn" id="repeatBtn" type="button" aria-label="Repeat: off" aria-pressed="false" title="Repeat">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
            <span class="rep-one">1</span>
          </button>
        </div>
        <div class="seekrow">
          <span id="curTime">0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek" />
          <span id="totTime">0:00</span>
        </div>
      </div>
    </div>

    <audio id="audio" preload="metadata"></audio>

    <script>
      "use strict";
      var BASE = "https://quantuminuofficial.com/assets/music/";
      // Catalog in the site's newest-first order. dur = seconds.
      var TRACKS = [
        ["heart-of-the-resistance","Heart Of The Resistance","Phat Boi J","Rock / Punk",209],
        ["forever-united","Forever United","Phat Boi J","Hardstyle",308],
        ["bajo-el-mismo-cielo","Bajo El Mismo Cielo","Phat Boi J","Bachata",371],
        ["quantum-bounce","Quantum Bounce","Vital","House",160],
        ["beyond-the-horizon","Beyond The Horizon","Phat Boi J","D&B",313],
        ["pon-di-top","Pon Di Top","Phat Boi J","Reggae",237],
        ["standing-tall","Standing Tall","Phat Boi J","Rock",289],
        ["higher-than-the-stars","Higher Than The Stars","Phat Boi J","Rock",360],
        ["dancing-through-the-blue","Dancing Through The Blue","Phat Boi J","House",319],
        ["one-consciousness","One Consciousness","Phat Boi J","Melodic House",414],
        ["rise-above-the-flame","Rise Above The Flame","Phat Boi J","Cinematic",436],
        ["carved-in-stone","Carved In Stone","Phat Boi J","Orchestral Rap",335],
        ["were-still-standing","We're Still Standing","Phat Boi J","Rock / Punk",261],
        ["feeling-quantum","Feeling Quantum","Vital","Rap",143],
        ["ghost-gonna-gechu","Ghost Gonna Gechu","Phat Boi J","Rap",288],
        ["haters-gonna-hate","Haters Gonna Hate","Phat Boi J","Orchestral Rap",246],
        ["la-familia-qi","La Familia QI","Phat Boi J","Merengue",265],
        ["infinite-qi","Infinite QI","Phat Boi J","Techno",316],
        ["diamond-paws","Diamond Paws","Phat Boi J","Rap",212],
        ["energia-quantica","Energia Quantica","Phat Boi J","Salsa",333],
        ["more-than-a-name","More Than A Name","Phat Boi J","Country",317],
        ["take-us-higher","Take Us Higher","Phat Boi J","Uplifting Trance",369],
        ["fuego-cuantico","Fuego Cuantico","Phat Boi J","Reggaeton",226],
        ["quantum-fi","Quantum-Fi","Phat Boi J","Lo-Fi",298],
        ["qi-family","QI Family","Phat Boi J","Rap",303],
        ["quantum-awakening","Quantum Awakening","Phat Boi J","Dark Metal",365],
        ["quantumania","Quantum Mania","Vital","House",76],
        ["quantum-train","Quantum Train","Phat Boi J","Country",283],
        ["quantum-warrior","Quantum Warriors","Phat Boi J","Rock / Metal",406],
        ["quantum-rising","Quantum Rising","Phat Boi J","Synthwave",327],
        ["quantum-chase","Quantum Chase","Phat Boi J","Psytrance / Rock",239],
        ["quantum-hodl","Quantum HODL","Phat Boi J","90s Rap",162],
        ["we-are-one","We Are One","Phat Boi J","Orchestral Rap",55],
        ["quantum-wave","Quantum Wave","Phat Boi J","Goa Psytrance",308]
      ].map(function (r, i) {
        return { id: i, file: r[0], title: r[1], artist: r[2], genre: r[3], dur: r[4],
                 src: BASE + r[0] + ".mp3", art: BASE + r[0] + ".jpg" };
      });

      function fmt(sec) {
        sec = Math.max(0, Math.floor(sec || 0));
        return Math.floor(sec / 60) + ":" + ("0" + (sec % 60)).slice(-2);
      }
      function shuffleArr(a) {
        a = a.slice();
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
      }

      var audio = document.getElementById("audio");
      var rowsEl = document.getElementById("rows");
      var emptyEl = document.getElementById("emptyState");
      var searchEl = document.getElementById("search");
      var chipsEl = document.getElementById("chips");

      var state = {
        sortKey: null,        // null = catalog order ("Newest")
        sortDir: 1,
        query: "",
        genre: "All",
        currentId: -1,        // track id loaded in the player
        queue: [],            // track ids in displayed order at play time
        order: [],            // play order (queue, or shuffled)
        orderPos: -1,
        shuffle: false,
        repeat: 0             // 0 off, 1 all, 2 one
      };

      /* ---------- genres / chips ---------- */
      var genres = ["All"];
      TRACKS.forEach(function (t) { if (genres.indexOf(t.genre) === -1) genres.push(t.genre); });
      genres.forEach(function (g) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "chip";
        b.textContent = g;
        b.setAttribute("aria-pressed", g === "All" ? "true" : "false");
        b.addEventListener("click", function () {
          state.genre = g;
          chipsEl.querySelectorAll(".chip").forEach(function (c) {
            c.setAttribute("aria-pressed", c === b ? "true" : "false");
          });
          document.getElementById("genreCurrent").textContent = g === "All" ? "All genres" : g;
          setGenreMenu(false);
          render();
        });
        chipsEl.appendChild(b);
      });

      /* ---------- genre menu toggle ---------- */
      var genreToggle = document.getElementById("genreToggle");
      var genrePanel = document.getElementById("genrePanel");
      function setGenreMenu(open) {
        genrePanel.classList.toggle("open", open);
        genreToggle.setAttribute("aria-expanded", open ? "true" : "false");
      }
      genreToggle.addEventListener("click", function () {
        setGenreMenu(!genrePanel.classList.contains("open"));
      });

      /* ---------- displayed list ---------- */
      function displayed() {
        var q = state.query.trim().toLowerCase();
        var list = TRACKS.filter(function (t) {
          if (state.genre !== "All" && t.genre !== state.genre) return false;
          if (!q) return true;
          return (t.title + " " + t.artist + " " + t.genre).toLowerCase().indexOf(q) !== -1;
        });
        if (state.sortKey) {
          var k = state.sortKey, d = state.sortDir;
          list = list.slice().sort(function (a, b) {
            var r;
            if (k === "dur") r = a.dur - b.dur;
            else r = a[k].toLowerCase() < b[k].toLowerCase() ? -1 : (a[k].toLowerCase() > b[k].toLowerCase() ? 1 : 0);
            if (r === 0) r = a.id - b.id;
            return r * d;
          });
        }
        return list;
      }

      function render() {
        var list = displayed();
        rowsEl.innerHTML = "";
        list.forEach(function (t, i) {
          var row = document.createElement("div");
          row.className = "row" + (t.id === state.currentId ? " active" : "");
          row.setAttribute("role", "row");
          row.setAttribute("tabindex", "0");
          row.dataset.id = t.id;
          row.setAttribute("aria-label", "Play " + t.title + " by " + t.artist);

          var num = document.createElement("div");
          num.className = "r-num";
          num.innerHTML = '<span class="idx">' + (i + 1) + '</span>' +
            '<span class="play-hint" aria-hidden="true">▶</span>' +
            '<span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>';

          var img = document.createElement("img");
          img.className = "r-art";
          img.src = t.art;
          img.alt = "";
          img.loading = "lazy";

          var main = document.createElement("div");
          main.className = "r-main";
          var title = document.createElement("div");
          title.className = "r-title";
          title.textContent = t.title;
          var sub = document.createElement("div");
          sub.className = "r-sub";
          sub.textContent = t.artist + " · " + t.genre;
          main.appendChild(title);
          main.appendChild(sub);

          var artist = document.createElement("div");
          artist.className = "r-artist";
          artist.textContent = t.artist;
          var genre = document.createElement("div");
          genre.className = "r-genre";
          genre.textContent = t.genre;
          var dur = document.createElement("div");
          dur.className = "r-dur";
          dur.textContent = fmt(t.dur);

          row.appendChild(num);
          row.appendChild(img);
          row.appendChild(main);
          row.appendChild(artist);
          row.appendChild(genre);
          row.appendChild(dur);

          row.addEventListener("click", function () { playFromList(t.id); });
          row.addEventListener("keydown", function (e) {
            if (e.key === "Enter" || e.key === " ") { e.preventDefault(); playFromList(t.id); }
          });
          rowsEl.appendChild(row);
        });
        emptyEl.classList.toggle("show", list.length === 0);
        var tc = document.getElementById("trackCount");
        tc.textContent = list.length === TRACKS.length
          ? TRACKS.length + " songs"
          : list.length + " of " + TRACKS.length + " songs";
      }

      /* ---------- sorting ---------- */
      document.querySelectorAll(".hcell[data-sort]").forEach(function (h) {
        h.addEventListener("click", function () {
          var k = h.getAttribute("data-sort");
          if (state.sortKey === k) {
            if (state.sortDir === 1) { state.sortDir = -1; }
            else { state.sortKey = null; state.sortDir = 1; }  // third click: back to Newest
          } else { state.sortKey = k; state.sortDir = 1; }
          document.querySelectorAll(".hcell[data-sort]").forEach(function (x) {
            var on = x.getAttribute("data-sort") === state.sortKey;
            x.classList.toggle("sorted", on);
            x.querySelector(".arrow").textContent = on ? (state.sortDir === 1 ? "▲" : "▼") : "";
          });
          render();
        });
      });

      /* ---------- playback ---------- */
      var npArt = document.getElementById("npArt");
      var npTitle = document.getElementById("npTitle");
      var npArtist = document.getElementById("npArtist");
      var playBtn = document.getElementById("playBtn");
      var playIcon = document.getElementById("playIcon");
      var pauseIcon = document.getElementById("pauseIcon");
      var seekEl = document.getElementById("seek");
      var curTimeEl = document.getElementById("curTime");
      var totTimeEl = document.getElementById("totTime");
      var seeking = false;

      /* ---------- expandable now playing ---------- */
      var playerEl = document.querySelector(".player");
      var npExpand = document.getElementById("npExpand");
      var npBigArt = document.getElementById("npBigArt");
      var npBigTitle = document.getElementById("npBigTitle");
      var npBigArtist = document.getElementById("npBigArtist");
      var npClose = document.getElementById("npClose");
      var expanded = false;
      function setExpanded(on) {
        if (on && state.currentId === -1) return;
        expanded = on;
        playerEl.classList.toggle("expanded", on);
        npArt.setAttribute("aria-expanded", on ? "true" : "false");
        npExpand.setAttribute("aria-hidden", on ? "false" : "true");
        npClose.tabIndex = on ? 0 : -1;
      }
      npArt.addEventListener("click", function () { setExpanded(!expanded); });
      npArt.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          e.stopPropagation();
          setExpanded(!expanded);
        }
      });
      npClose.addEventListener("click", function () { setExpanded(false); });
      npBigArt.addEventListener("click", function () { setExpanded(false); });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && expanded) setExpanded(false);
      });

      function buildOrder(queueIds, startId) {
        if (state.shuffle) {
          var rest = shuffleArr(queueIds.filter(function (id) { return id !== startId; }));
          return [startId].concat(rest);
        }
        return queueIds.slice();
      }

      function loadTrack(id, autoplay) {
        var t = TRACKS[id];
        state.currentId = id;
        audio.src = t.src;
        npArt.src = t.art;
        npArt.alt = t.title + " artwork";
        npArt.hidden = false;
        npTitle.textContent = t.title;
        npArtist.textContent = t.artist + " · " + t.genre;
        npBigArt.src = t.art;
        npBigArt.alt = t.title + " artwork";
        npBigTitle.textContent = t.title;
        npBigArtist.textContent = t.artist + " · " + t.genre;
        totTimeEl.textContent = fmt(t.dur);
        curTimeEl.textContent = "0:00";
        seekEl.value = 0;
        setFill(seekEl, 0);
        rowsEl.querySelectorAll(".row").forEach(function (r) {
          r.classList.toggle("active", +r.dataset.id === id);
        });
        if (autoplay) audio.play().catch(function () {});
      }

      function playFromList(id) {
        if (id === state.currentId && audio.src) { togglePlay(); return; }
        var queueIds = displayed().map(function (t) { return t.id; });
        if (queueIds.indexOf(id) === -1) queueIds = TRACKS.map(function (t) { return t.id; });
        state.queue = queueIds;
        state.order = buildOrder(queueIds, id);
        state.orderPos = state.order.indexOf(id);
        loadTrack(id, true);
      }

      function playFromOrder(order, pos) {
        state.order = order;
        state.orderPos = pos;
        loadTrack(order[pos], true);
      }

      function step(dir) {
        if (!state.order.length) {
          var list = displayed();
          if (!list.length) return;
          playFromList(list[0].id);
          return;
        }
        var pos = state.orderPos + dir;
        if (pos >= state.order.length) {
          if (state.repeat === 1) pos = 0; else return;
        }
        if (pos < 0) {
          if (audio.currentTime > 3) { audio.currentTime = 0; return; }
          pos = state.repeat === 1 ? state.order.length - 1 : 0;
        }
        playFromOrder(state.order, pos);
      }

      function togglePlay() {
        if (state.currentId === -1) {
          var list = displayed();
          if (list.length) playFromList(list[0].id);
          return;
        }
        if (audio.paused) audio.play().catch(function () {});
        else audio.pause();
      }

      playBtn.addEventListener("click", togglePlay);
      document.getElementById("nextBtn").addEventListener("click", function () { step(1); });
      document.getElementById("prevBtn").addEventListener("click", function () { step(-1); });
      var shuffleBtn = document.getElementById("shuffleBtn");
      function syncShuffleBtn() {
        shuffleBtn.classList.toggle("on", state.shuffle);
        shuffleBtn.setAttribute("aria-pressed", state.shuffle ? "true" : "false");
      }
      shuffleBtn.addEventListener("click", function () {
        state.shuffle = !state.shuffle;
        syncShuffleBtn();
        if (state.currentId !== -1 && state.queue.length) {
          state.order = buildOrder(state.queue, state.currentId);
          state.orderPos = state.order.indexOf(state.currentId);
        }
      });

      var repeatBtn = document.getElementById("repeatBtn");
      var repeatNames = ["Repeat: off", "Repeat: all", "Repeat: one"];
      repeatBtn.addEventListener("click", function () {
        state.repeat = (state.repeat + 1) % 3;
        repeatBtn.classList.toggle("on", state.repeat !== 0);
        repeatBtn.classList.toggle("repeat-one", state.repeat === 2);
        repeatBtn.setAttribute("aria-pressed", state.repeat !== 0 ? "true" : "false");
        repeatBtn.setAttribute("aria-label", repeatNames[state.repeat]);
        repeatBtn.title = repeatNames[state.repeat];
      });

      audio.addEventListener("play", function () {
        document.body.classList.add("playing");
        playIcon.style.display = "none";
        pauseIcon.style.display = "block";
        playBtn.setAttribute("aria-label", "Pause");
      });
      audio.addEventListener("pause", function () {
        document.body.classList.remove("playing");
        playIcon.style.display = "block";
        pauseIcon.style.display = "none";
        playBtn.setAttribute("aria-label", "Play");
      });
      audio.addEventListener("ended", function () {
        if (state.repeat === 2) { audio.currentTime = 0; audio.play().catch(function () {}); return; }
        var pos = state.orderPos + 1;
        if (pos >= state.order.length) {
          if (state.repeat === 1 && state.order.length) pos = 0;
          else return;
        }
        playFromOrder(state.order, pos);
      });
      audio.addEventListener("loadedmetadata", function () {
        if (isFinite(audio.duration)) totTimeEl.textContent = fmt(audio.duration);
      });
      audio.addEventListener("timeupdate", function () {
        if (seeking) return;
        curTimeEl.textContent = fmt(audio.currentTime);
        if (isFinite(audio.duration) && audio.duration > 0) {
          var p = Math.round((audio.currentTime / audio.duration) * 1000);
          seekEl.value = p;
          setFill(seekEl, (p / 1000) * 100);
        }
      });

      function setFill(el, pct) { el.style.setProperty("--fill", pct + "%"); }
      seekEl.addEventListener("input", function () {
        seeking = true;
        setFill(seekEl, (seekEl.value / 1000) * 100);
        if (isFinite(audio.duration)) curTimeEl.textContent = fmt((seekEl.value / 1000) * audio.duration);
      });
      seekEl.addEventListener("change", function () {
        if (isFinite(audio.duration)) audio.currentTime = (seekEl.value / 1000) * audio.duration;
        seeking = false;
      });

      /* ---------- no pull-to-refresh, no zoom ---------- */
      // iOS Safari pinch gesture
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("gesturechange", function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("gestureend", function (e) { e.preventDefault(); }, { passive: false });
      // Trackpad pinch / Ctrl+scroll zoom
      document.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
      // Keyboard zoom shortcuts (Ctrl/Cmd + + / - / 0)
      document.addEventListener("keydown", function (e) {
        if ((e.ctrlKey || e.metaKey) && (e.key === "+" || e.key === "-" || e.key === "=" || e.key === "0")) {
          e.preventDefault();
        }
      });

      /* ---------- search & keys ---------- */
      searchEl.addEventListener("input", function () {
        state.query = searchEl.value;
        render();
      });
      document.addEventListener("keydown", function (e) {
        if (e.code === "Space" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
          e.preventDefault();
          togglePlay();
        }
      });

      render();
    </script>
  </body>
</html>
